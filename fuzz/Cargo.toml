[package]
name = "sodigy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sodigy-code-gen = { path = "../crates/code-gen" }
sodigy-driver = { path = "../crates/driver" }
sodigy-fs-api = { path = "../crates/fs-api" }
sodigy-object-file = { path = "../crates/object-file" }
sodigy-optimize = { path = "../crates/optimize" }
sodigy-span = { path = "../crates/span" }

[dependencies.sodigy]
path = ".."

[[bin]]
name = "cnr"
path = "fuzz_targets/cnr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "empty"
path = "fuzz_targets/empty.rs"
test = false
doc = false
bench = false
